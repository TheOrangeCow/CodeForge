{% extends "base.html" %}
{% block title %}Write a problem - CodeForge{% endblock %}
{% block content %}

<h1 class="page-title">Write a new problem</h1>
<p class="page-sub">Submitted problems go to the review board. They need {{ REQUIRED_APPROVALS }} reviewer approvals from people other than you - before they publish.</p>

<form method="POST" class="stack-form wide-form">
    <label>
        Title
        <input type="text" name="title" value="{{ form.title or '' }}" required minlength="4">
    </label>

    <div class="form-row">
        <label>
            Book
            <select name="book_id" required>
                <option value="">Choose a book…</option>
                {% for b in books %}
                <option value="{{ b.id }}" {{ 'selected' if form.book_id|string==b.id|string else '' }}>{{ b.name }}
                </option>
                {% endfor %}
            </select>
        </label>
        <label>
            Difficulty (1–5)
            <input type="number" name="difficulty" min="1" max="5" value="{{ form.difficulty or 2 }}" required>
        </label>
        <label>
            Points
            <input type="number" name="points" min="1" value="{{ form.points or 10 }}" required>
        </label>
    </div>

    <label>
        Problem statement
        <textarea name="statement" rows="8" required minlength="20">{{ form.statement or '' }}</textarea>
    </label>

    <label>
        Correct answer <span class="dim">(exact match, case-insensitive - checked, never shown)</span>
        <input type="text" name="answer" required autocomplete="off">
    </label>

    <button type="submit" class="solid-btn">Submit for review</button>
</form>

{% endblock %}
